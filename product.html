
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Aotearoa Adventure Gear</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/style.css">

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search,shopping_cart,arrow_back_ios,arrow_forward_ios,menu,north"
      />

</head>
<body>

 <header class="relative flex items-center justify-between bg-white px-3 py-3 lg:bg-transparent md:px-10">
    <!-- Left section: mobile menu, logo, and search -->
    <div class="flex items-center gap-3 lg:gap-2">

        <!-- Mobile menu button -->
        <button
        id="menu-button"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        class="flex items-center lg:hidden"
        >
        <span class="material-symbols-outlined">menu</span>
        </button>

        <!-- Logo -->
        <a href="index.html">
        <img
            src="images/logo.png"
            alt="Aotearoa Adventure Gear logo"
            class="w-40 md:w-28 rounded-md"
        >
        </a>

        <!-- Search Bar -->
        <form action="shop.html" class="w-full search-form">
            <!-- Desktop search bar -->
            <div class="hidden h-12 justify-center gap-5 md:flex">
                <div class="flex w-100 max-w-md items-center gap-2 rounded-md border-2 px-2 backdrop-blur-[2px]">
                <span aria-hidden="true" class="material-symbols-outlined">search</span>
                <input
                    type="search"
                    name="search"
                    placeholder="Search..."
                    class="search-input flex-1 border-0 bg-transparent outline-none"
                >
                </div>
            </div>
        </form>


    </div>

    <!-- Desktop navigation -->
    <nav aria-label="Main navigation" class="hidden items-center lg:flex">
        <a href="index.html" class="border-r px-5 text-gray-600 hover:text-gray-900 xl:px-10">Home</a>
        <a href="shop.html" class="border-r px-5 text-gray-600 hover:text-gray-900 xl:px-10">Shop</a>
        <a href="index.html#about" class="border-r px-5 text-gray-600 hover:text-gray-900 xl:px-10">About</a>
        <a href="index.html#help" class="px-5 text-gray-600 hover:text-gray-900 xl:px-10">Help</a>

        <a
        href="cart.html"
        class="flex items-center gap-2 rounded-md bg-gray-700 px-4 py-2 text-white transition-colors duration-200 hover:bg-gray-800"
        >
        <span class="material-symbols-outlined cart-icon">shopping_cart</span>
        Your Cart
        </a>

        </nav>
        <!-- Mobile cart -->
        <a href="cart.html" class="lg:hidden" aria-label="Shopping cart">
            <span class="material-symbols-outlined cart-icon">shopping_cart</span>
        </a>
        <!-- Mobile dropdown menu -->
        <nav
            id="mobile-menu"
            aria-label="Mobile navigation"
            class="absolute left-0 top-full z-50 hidden w-full flex-col gap-5 border-y border-gray-300 bg-white p-5 lg:hidden"
        >
            <a href="index.html" class="text-gray-600 hover:text-gray-900">Home</a>
            <a href="shop.html" class="text-gray-600 hover:text-gray-900">Shop</a>
            <a href="index.html#about" class="text-gray-600 hover:text-gray-900">About</a>
            <a href="index.html#help" class="text-gray-600 hover:text-gray-900">Help</a>

            <form action="shop.html" method="get" class="search-form flex gap-2">
                <!-- Mobile search bar -->
                <div class="flex h-13 w-full items-center gap-2 rounded-md border border-gray-300 bg-gray-100 px-2 md:hidden">
                    <span aria-hidden="true" class="material-symbols-outlined">search</span>
                    <input
                    type="search"
                    name="search"
                    placeholder="Search..."
                    class="search-input min-w-0 flex-1 border-0 bg-transparent outline-none"
                    >
                </div>
            </form>
        </nav>

    </header>

    <main class="p-5 md:p-10">

        <!-- Back to shop link -->
        <a href="shop.html"
           class="inline-flex items-center gap-2 mb-8 text-gray-600 hover:text-gray-900 transition-colors">
            <span>←</span>
            <span>Back to Shop</span>
        </a>

        <!-- Product image and information -->
        <section class="grid grid-cols-1 lg:grid-cols-2 border">

            <!-- Product image -->
            <div class="flex items-center justify-center p-5 md:p-10 border-b lg:border-b-0 lg:border-r">
                <img
                    id="product-image"
                    src=""
                    alt=""
                    class="w-full h-80 lg:h-125 object-cover rounded-md"
                >
            </div>

            
            <!-- Product information -->
            <div class="p-6 md:p-10">

                <!-- Product title -->
                <h1 id="product-name"
                    class="text-3xl md:text-4xl font-light mb-3 uppercase">
                </h1>

                <!-- Product rating -->
                <div class="flex items-center gap-4 mb-6">
                    <span id="product-rating"></span>

                    <span id="product-review-count"
                          class="text-gray-400 text-sm">
                    </span>
                </div>

                <hr class="mb-6">

                <!-- Product price and model -->
                <div class="flex items-center justify-between gap-5 mb-6">
                    <p id="product-price" class="text-2xl font-light"></p>

                    <select id="product-model" class="border p-2 w-40">
                        <option value="">Select Model</option>
                        <option value="Standard">Standard</option>
                        <option value="Premium">Premium</option>
                    </select>
                </div>

                <hr class="mb-6">

                <!-- Product description -->
                <p id="product-description"
                  class="text-gray-500 leading-7 mb-8">
                </p>

                <!-- Add to cart button -->
                <button
                    id="add-to-cart"
                    type="button"
                    class="bg-[#2F4B4D] text-white px-6 py-3 rounded-md hover:bg-gray-800 transition-colors duration-200">
                    Add To Cart
                </button>

            </div>


        </section>

        <!-- Similar products -->
        <section id="similar-products" class="border-b p-5 md:p-10">
            <h2 class="mb-8 text-center text-3xl font-light md:text-4xl">
                Similar Products
            </h2>

            <div
                id="similar-products-container"
                class="grid grid-cols-1 gap-8 lg:grid-cols-3"
            ></div>
        </section>


        <!-- Product reviews -->
        <section id="product-reviews" class="py-10">
            <h2 class="text-2xl font-semibold mb-6">Reviews</h2>
            <p class="text-gray-400 text-sm">No reviews yet</p>
        </section>

    </main>

    <!-- Footer -->
    <footer id="help" class="bg-gray-800 p-6 text-white md:p-12">

        <div class="flex flex-col md:flex-row justify-center mb-5">
            <a href="index.html" class="border-r px-5 hover:text-gray-500 xl:px-10">Home</a>
            <a href="shop.html" class="border-r px-5 hover:text-gray-500 xl:px-10">Shop</a>
            <a href="index.html#about" class="border-r px-5  hover:text-gray-500 xl:px-10">About</a>
            <a href="index.html#help" class="px-5  hover:text-gray-500 xl:px-10">Help</a>
        </div>

        <!-- Copyright -->
        <div>
            <hr class="mb-5 border-gray-500">

            <p class="text-sm font-light text-center">
                &copy; <span id="current-year"></span>
                Aotearoa Adventure Gear. All rights reserved.
            </p>
        </div>

    </footer>

    <script src="js/products.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/search.js" defer></script>
    <script src="js/script.js" defer></script>
</body>
</html>
